<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>資金の出所しらべ</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%23E9EAE4'/%3E%3Ccircle cx='27' cy='27' r='15' fill='none' stroke='%231C2321' stroke-width='5'/%3E%3Cline x1='38' y1='38' x2='54' y2='54' stroke='%231C2321' stroke-width='6' stroke-linecap='round'/%3E%3Cpath d='M20 27h14M27 20v14' stroke='%231B5E4A' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">

<!--
  ─────────────────────────────────────────────────────────────
  改訂2 の変更点

  1. internalTransfer / spotTransfer を「口座内の振替」から外した。
     これらは Hyperliquid アカウント間の送金であって、他人からの
     入金でありうる。初版はここを捨てていたため、資金の出所を
     丸ごと見落とす欠陥があった。いまは相手アドレス付きで別枠表示する。
  2. 台帳イベントの全種別と件数を画面に出す。何を除外したか
     見えなかったことが 1 の原因だったため。
  3. さかのぼる期間を選べるようにした（1年 / 3年 / 全期間）。
  4. Solana と Ethereum の受け皿を公開RPCで自動判定する。
     Ethereum は ERC-20 の受領までは見ないので、その旨を表示する。
  5. fetch に referrerPolicy: no-referrer を付けた。

  自分でホストするとき

  - index.html として置き、Settings > Pages で公開するだけ。ビルド不要。
  - API キーは埋め込んでいない。公開・認証不要の口だけを使う。
  - 入力内容はこのサイトのどこにも保存しない（localStorage も Cookie も未使用）。
    ただし入力したアドレスは問い合わせ先のサーバーには届く。画面の注意書き参照。
  - CORS で失敗する場合は中継サーバー欄を使う。Cloudflare Workers の例:
      export default { async fetch(req) {
        const u = new URL(req.url).searchParams.get('u');
        const r = await fetch(u, {method:req.method,
          body: req.method==='POST' ? await req.text() : undefined,
          headers:{'content-type':'application/json'}});
        return new Response(r.body, {status:r.status,
          headers:{'access-control-allow-origin':'*','content-type':'application/json'}});
      }}
    欄には https://xxx.workers.dev/?u= を入れる。
    ※中継サーバーの運営者には、調べたアドレスが全部見える。
  ─────────────────────────────────────────────────────────────
-->
<style>
:root{
  --paper:#E9EAE4; --paper-hi:#F3F4EF; --ink:#1C2321; --ink-soft:#5A625C;
  --rule:#C3C6BC; --rule-hard:#9AA096;
  --in:#1B5E4A; --in-bg:#DDE7E0; --out:#A8322D; --note:#7A5C1E;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"IBM Plex Sans JP",system-ui,sans-serif;line-height:1.7;font-feature-settings:"palt"}
.mono{font-family:"IBM Plex Mono","IBM Plex Sans JP",monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:1000px;margin:0 auto;padding:0 20px 96px}
header{padding:56px 0 28px;border-bottom:2px solid var(--ink)}
h1{margin:0 0 6px;font-size:clamp(28px,4.4vw,40px);font-weight:600;letter-spacing:.02em}
.lede{margin:0;max-width:56ch;color:var(--ink-soft);font-size:15px}
.query{margin:28px 0 0;display:flex;gap:10px;flex-wrap:wrap;align-items:stretch}
.query input[type=text]{flex:1 1 340px;min-width:0;padding:13px 14px;
  border:1px solid var(--rule-hard);background:var(--paper-hi);color:var(--ink);
  font-family:"IBM Plex Mono",monospace;font-size:14px;border-radius:2px}
.query input[type=text]:focus{outline:2px solid var(--in);outline-offset:1px}
select{padding:13px 10px;border:1px solid var(--rule-hard);background:var(--paper-hi);
  color:var(--ink);font-family:inherit;font-size:14px;border-radius:2px}
button{padding:13px 26px;border:1px solid var(--ink);background:var(--ink);color:var(--paper-hi);
  font-family:inherit;font-size:15px;font-weight:600;border-radius:2px;cursor:pointer}
button:hover{background:#000}
button:disabled{opacity:.45;cursor:progress}
button:focus-visible,select:focus-visible{outline:2px solid var(--in);outline-offset:2px}
.hint{margin:10px 0 0;font-size:13px;color:var(--ink-soft)}
.verdict{margin:32px 0 0;padding:22px 24px;background:var(--paper-hi);
  border:1px solid var(--rule);border-left:5px solid var(--ink)}
.verdict h2{margin:0 0 6px;font-size:20px;font-weight:600}
.verdict p{margin:0;color:var(--ink-soft);font-size:14px}
.verdict.ok{border-left-color:var(--in)}
.verdict.none{border-left-color:var(--note)}
.verdict.bad{border-left-color:var(--out)}
.book{margin:38px 0 0}
.book h3.title{margin:0 0 2px;font-size:17px;font-weight:600}
.book p.title-sub{margin:0 0 10px;font-size:13px;color:var(--ink-soft);max-width:64ch}
.ledger{display:grid;grid-template-columns:1fr 1fr;border-top:2px solid var(--ink)}
.ledger>section{padding:18px 20px 24px}

.ledger .sub{margin:0 0 14px;font-size:12.5px;color:var(--ink-soft)}

.side-out h4{color:var(--out)}

.side-out .total{color:var(--out)}
.entry{padding:11px 0;border-top:1px solid var(--rule)}
.entry .amt{font-size:16px;font-weight:600}
.entry .who{display:block;margin-top:3px;font-size:12px;word-break:break-all;color:var(--ink-soft)}
.entry .who a{color:var(--ink-soft)}
.entry .when{font-size:12px;color:var(--ink-soft)}
.more{padding:10px 0 0;font-size:12.5px;color:var(--ink-soft);border-top:1px solid var(--rule)}
.block{margin:44px 0 0}
.block h3{margin:0 0 4px;font-size:16px;font-weight:600}
.block .sub{margin:0 0 14px;font-size:13px;color:var(--ink-soft);max-width:64ch}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-weight:600;font-size:13px;border-bottom:1px solid var(--rule-hard)}
td.addr{font-family:"IBM Plex Mono",monospace;font-size:12px;word-break:break-all}
td.num{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;text-align:right}
td a{color:var(--in)}
.badge{display:inline-block;padding:1px 8px;border-radius:2px;font-size:12px;font-weight:600;white-space:nowrap}
.badge.used{background:var(--in-bg);color:var(--in)}
.badge.unused{background:transparent;color:var(--ink-soft);border:1px solid var(--rule-hard)}
.badge.unknown{background:transparent;color:var(--note);border:1px dashed var(--note)}
tr.kept td:first-child{border-left:3px solid var(--in);padding-left:7px}
tr.dropped td:first-child{border-left:3px solid var(--rule-hard);padding-left:7px}
.notes{margin:44px 0 0;padding:18px 20px;border:1px dashed var(--rule-hard);font-size:13px;color:var(--ink-soft)}
.notes ul{margin:8px 0 0;padding-left:1.2em}
.notes li{margin:5px 0}
details{margin:20px 0 0;font-size:13px}
summary{cursor:pointer;color:var(--ink-soft)}
pre{background:var(--paper-hi);border:1px solid var(--rule);padding:12px;overflow:auto;
  font-size:11.5px;max-height:340px;font-family:"IBM Plex Mono",monospace}
.proxy{margin:26px 0 0;font-size:13px;color:var(--ink-soft)}
.proxy input{width:100%;max-width:520px;margin-top:6px;padding:9px 11px;
  border:1px solid var(--rule-hard);background:var(--paper-hi);
  font-family:"IBM Plex Mono",monospace;font-size:12px;border-radius:2px}
.empty{padding:14px 0;color:var(--ink-soft);font-size:14px}
.spin{color:var(--ink-soft);font-size:14px;padding:14px 0}
@media (max-width:720px){
  .ledger{grid-template-columns:1fr}
  .ledger>section+section{border-left:0;border-top:1px solid var(--rule-hard)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<body>
<div class="wrap">

<header>
  <h1>資金の出所しらべ</h1>
  <p class="lede">アドレスを1つ貼ると、そこに入ってきたお金と出ていったお金を、相手先つきで並べます。Hyperliquid のアドレスなら、紐づく本体の BTC・ETH・SOL アドレスも逆算します。</p>
</header>

<div class="query">
  <input type="text" id="addr" spellcheck="false" autocomplete="off"
         placeholder="0x… / bc1… / Solana アドレス">
  <select id="span" aria-label="さかのぼる期間">
    <option value="1">1年分</option>
    <option value="3" selected>3年分</option>
    <option value="0">全期間</option>
  </select>
  <button id="go">調べる</button>
</div>
<p class="hint">例：<code class="mono">0x8DeF9F50456c6c4E37fA5d3D57F108ED23992daE</code></p>

<div id="out"></div>

<div class="proxy">
  中継サーバー（通信が失敗するときだけ使う。末尾に URL がそのまま繋がる形で入力）
  <input type="text" id="proxy" spellcheck="false" autocomplete="off"
         placeholder="https://自分のworker.dev/?u=">
</div>

</div>

<script>
"use strict";

const UNIT    = "https://api.hyperunit.xyz";
const MEMPOOL = "https://mempool.space/api";
const HLINFO  = "https://api.hyperliquid.xyz/info";
const SOL_RPC = "https://api.mainnet-beta.solana.com";
const ETH_RPC = "https://cloudflare-eth.com";

const $ = (s) => document.querySelector(s);
const out = $("#out");
let log = [];

/* ── 通信 ─────────────────────────────────────────── */
const proxied = (url) => {
  const p = $("#proxy").value.trim();
  return p ? p + encodeURIComponent(url) : url;
};
async function req(url, opts, tag){
  const t0 = performance.now();
  try{
    const r = await fetch(proxied(url), Object.assign({referrerPolicy:"no-referrer"}, opts));
    const ms = Math.round(performance.now()-t0);
    if(!r.ok){ log.push("\u2717 " + r.status + " " + (tag||url) + " (" + ms + "ms)"); return null; }
    log.push("\u2713 " + (tag||url) + " (" + ms + "ms)");
    return await r.json();
  }catch(e){
    log.push("\u2717 通信失敗 " + (tag||url) + " \u2014 " + e.message + "（CORS の可能性。中継サーバーを試す）");
    return null;
  }
}
const getJSON  = (u,t)   => req(u, {headers:{accept:"application/json"}}, t);
const postJSON = (u,b,t) => req(u, {method:"POST", headers:{"content-type":"application/json"},
                                    body:JSON.stringify(b)}, t);

/* ── 判別・整形 ───────────────────────────────────── */
function kindOf(a){
  if(/^0x[0-9a-fA-F]{40}$/.test(a))               return "evm";
  if(/^(bc1|tb1)[0-9a-z]{20,}$/i.test(a))         return "btc";
  if(/^[13][a-km-zA-HJ-NP-Z1-9]{24,34}$/.test(a)) return "btc";
  if(/^[1-9A-HJ-NP-Za-km-z]{32,44}$/.test(a))     return "sol";
  return null;
}
const DEC = {btc:8, eth:18, sol:9, avax:18, xpl:18, zec:8, mon:18, pump:6, fart:6};
const amt = (raw, asset) => {
  const n = Number(raw)/Math.pow(10, DEC[String(asset||"").toLowerCase()] ?? 18);
  return Number.isFinite(n) ? n : null;
};
const fmt = (n,dp) => (n==null || !Number.isFinite(Number(n))) ? "\u2014"
  : Number(n).toLocaleString("ja-JP",{minimumFractionDigits:0,maximumFractionDigits:(dp==null?8:dp)});
const short = (a) => !a ? "\u2014" : (String(a).length>22 ? String(a).slice(0,10)+"\u2026"+String(a).slice(-8) : String(a));
const day = (t) => !t ? "" : String(t).slice(0,10);
const esc = (s) => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const ADDR_URL = {
  bitcoin:  a=>"https://mempool.space/address/"+a,
  ethereum: a=>"https://etherscan.io/address/"+a,
  solana:   a=>"https://solscan.io/account/"+a,
  hyperliquid: a=>"https://hypurrscan.io/address/"+a,
};
function link(chain, a){
  const f = ADDR_URL[chain];
  const looksAddr = a && /^(0x[0-9a-fA-F]{6,}|bc1|tb1|[1-9A-HJ-NP-Za-km-z]{20,})/.test(String(a));
  if(f && looksAddr) return '<a href="'+f(a)+'" target="_blank" rel="noopener">'+esc(short(a))+'</a>';
  return esc(short(a));
}

/* ── 台帳の3層分類 ─────────────────────────────────
   外部  : deposit / withdraw               チェーンをまたぐ出入り
   他口座: internalTransfer / spotTransfer  Hyperliquid 上の別アカウント相手
           （初版はここを捨てていた。他人からの入金がここに入る）
   自分  : subAccountTransfer / accountClassTransfer / perpDexClassTransfer
   ──────────────────────────────────────────────── */
const SELF_TYPES = new Set(["subAccountTransfer","accountClassTransfer","perpDexClassTransfer"]);
const PEER_TYPES = new Set(["internalTransfer","spotTransfer","send","cStakingTransfer"]);
const TYPE_JA = {
  deposit:"外部チェーンからの入金", withdraw:"外部チェーンへの出金",
  internalTransfer:"他アカウントとの USDC 送金", spotTransfer:"他アカウントとの現物送金",
  send:"送付", cStakingTransfer:"ステーク済 HYPE の移動",
  subAccountTransfer:"サブ口座との振替", accountClassTransfer:"現物と証拠金の振替",
  perpDexClassTransfer:"別 perp DEX との振替",
  liquidation:"強制決済", vaultDeposit:"Vault へ預入", vaultWithdraw:"Vault から払戻",
  vaultDistribution:"Vault の分配", vaultLeaderCommission:"Vault 報酬",
  rewardsClaim:"報酬の受取", spotGenesis:"初期配布", accountActivationGas:"口座開設手数料",
  borrowLend:"貸借", deployGasAuction:"デプロイ入札", vaultCreate:"Vault 作成",
};

function classifyLedger(events, self){
  const me = String(self||"").toLowerCase();
  const tally = {};
  const ext={in:[],out:[]}, peer={in:[],out:[]}, other={in:[],out:[]};

  for(const e of (events||[])){
    const d = (e && e.delta) || {};
    const t = d.type || "(不明)";
    tally[t] = (tally[t]||0) + 1;
    const time = e && e.time ? new Date(e.time).toISOString() : "";
    const usdc = Number(d.usdc != null ? d.usdc : (d.usdcValue != null ? d.usdcValue : 0));
    const dest = String(d.destination||"").toLowerCase();
    const from = String(d.user||"").toLowerCase();

    if(t === "deposit"){
      ext.in.push({value:Math.abs(usdc), unit:"USDC", time, dir:"in",
                   chain:"ethereum", who:"外部チェーンのブリッジ"});
    }else if(t === "withdraw"){
      ext.out.push({value:Math.abs(usdc), unit:"USDC", time, dir:"out",
                    chain:"ethereum", who:"外部チェーンへ"});
    }else if(PEER_TYPES.has(t)){
      const incoming = dest===me ? true : (from===me ? false : usdc>0);
      const counter  = incoming ? (d.user||"(相手不明)") : (d.destination||"(相手不明)");
      const isSpot   = (t==="spotTransfer" || t==="send");
      const value    = isSpot ? Math.abs(Number(d.amount != null ? d.amount : usdc)) : Math.abs(usdc);
      const unit     = isSpot ? String(d.token||"token") : "USDC";
      (incoming?peer.in:peer.out).push({value, unit, time,
        dir: incoming?"in":"out", chain:"hyperliquid", who:counter});
    }else if(!SELF_TYPES.has(t)){
      const incoming = usdc > 0;
      (incoming?other.in:other.out).push({value:Math.abs(usdc), unit:"USDC", time,
        dir: incoming?"in":"out", chain:"hyperliquid", who: TYPE_JA[t] || t});
    }
  }
  const byTimeDesc = (a)=>a.sort((x,y)=>String(y.time).localeCompare(String(x.time)));
  [ext.in,ext.out,peer.in,peer.out,other.in,other.out].forEach(byTimeDesc);
  return {ext, peer, other, tally};
}

/* ── 描画 ─────────────────────────────────────────── */
const verdict = (cls,title,body) =>
  '<div class="verdict '+cls+'"><h2>'+esc(title)+'</h2><p>'+body+'</p></div>';

const MAX_ROWS = 12;
function ledger(title, subtitle, ins, outs, subIn, subOut){
  if(!ins.length && !outs.length) return "";
  const sum = rows => rows.reduce((s,r)=>s+(Number(r.value)||0),0);
  const unitOf = rows => rows.length && rows.every(r=>r.unit===rows[0].unit) ? rows[0].unit : "";
  const row = r => '<div class="entry"><span class="amt mono">'
      + fmt(r.value, r.unit==="USDC" ? 2 : 8) + ' ' + esc(r.unit||"")
      + '</span><span class="when mono"> ' + esc(day(r.time))
      + '</span><span class="who mono">' + (r.dir==="in" ? "\u2190" : "\u2192") + ' '
      + link(r.chain, r.who) + '</span></div>';
  const side = (cls,h,sub,rows) => '<section class="'+cls+'"><h4>'+esc(h)+'</h4>'
      + '<p class="sub">'+esc(sub)+'</p>'
      + '<p class="total mono">' + (rows.length ? fmt(sum(rows),2)+" "+esc(unitOf(rows)) : "\u2014") + '</p>'
      + (rows.length ? rows.slice(0,MAX_ROWS).map(row).join("") : '<p class="empty">記録がありません。</p>')
      + (rows.length>MAX_ROWS ? '<p class="more">ほか '+(rows.length-MAX_ROWS)+' 件（合計には入っています）</p>' : '')
      + '</section>';
  return '<div class="book"><h3 class="title">'+esc(title)+'</h3>'
    + '<p class="title-sub">'+esc(subtitle)+'</p><div class="ledger">'
    + side("side-in","入ってきた",subIn,ins)
    + side("side-out","出ていった",subOut,outs)
    + '</div></div>';
}

function tallyTable(tally){
  const keys = Object.keys(tally);
  if(!keys.length) return "";
  const rows = keys.sort((a,b)=>tally[b]-tally[a]).map(function(t){
    const kept = !SELF_TYPES.has(t);
    return '<tr class="'+(kept?"kept":"dropped")+'"><td>'+esc(TYPE_JA[t]||t)+'</td>'
      + '<td class="addr">'+esc(t)+'</td><td class="num">'+tally[t]+'</td>'
      + '<td>'+(kept?"表示している":"自分の口座内なので除外")+'</td></tr>';
  }).join("");
  return '<div class="block"><h3>台帳イベントの全内訳</h3>'
    + '<p class="sub">この口座で起きた出来事を種類ごとに数えたものです。除外したものも隠さず載せています。</p>'
    + '<table><thead><tr><th>内容</th><th>種別コード</th><th>件数</th><th>扱い</th></tr></thead>'
    + '<tbody>'+rows+'</tbody></table></div>';
}

function vessels(rows){
  if(!rows.length) return "";
  return '<div class="block"><h3>この口座に紐づく受け皿アドレス</h3>'
    + '<p class="sub">Hyperliquid 口座ごとに固定で割り当てられる入出金用アドレスです。管理しているのは Unit であって本人ではないので、注目すべきは「ここへ送ってきた相手」の方です。</p>'
    + '<table><thead><tr><th>チェーン</th><th>用途</th><th>アドレス</th><th>使われた形跡</th></tr></thead><tbody>'
    + rows.map(r=>'<tr><td>'+esc(r.chainLabel)+'</td><td>'+esc(r.role)+'</td>'
        + '<td class="addr">'+link(r.chain,r.address)+'</td><td>'+r.badge+'</td></tr>').join("")
    + '</tbody></table></div>';
}

const notes = items => '<div class="notes"><strong>読むときの注意</strong><ul>'
  + items.map(i=>'<li>'+i+'</li>').join("") + '</ul></div>';
const logBlock = () => '<details><summary>通信ログを見る（'+log.length+'件）</summary><pre>'
  + esc(log.join("\n")) + '</pre></details>';

/* ── 受け皿の使用有無 ─────────────────────────────── */
async function probeBTC(a){
  const d = await getJSON(MEMPOOL+"/address/"+a, "mempool "+short(a));
  if(!d) return {known:false};
  const cs = d.chain_stats||{}, ms = d.mempool_stats||{};
  return {known:true, txs:(cs.tx_count||0)+(ms.tx_count||0),
    received:(cs.funded_txo_sum||0)/1e8, sent:(cs.spent_txo_sum||0)/1e8,
    balance:((cs.funded_txo_sum||0)-(cs.spent_txo_sum||0))/1e8};
}
async function probeSOL(a){
  const r = await postJSON(SOL_RPC,
    {jsonrpc:"2.0",id:1,method:"getSignaturesForAddress",params:[a,{limit:1}]},
    "solana "+short(a));
  if(!r || !("result" in r)) return {known:false};
  return {known:true, used:Array.isArray(r.result) && r.result.length>0};
}
async function probeETH(a){
  const b = await postJSON(ETH_RPC,
    {jsonrpc:"2.0",id:1,method:"eth_getBalance",params:[a,"latest"]}, "eth balance "+short(a));
  if(!b || !("result" in b)) return {known:false};
  const n = await postJSON(ETH_RPC,
    {jsonrpc:"2.0",id:2,method:"eth_getTransactionCount",params:[a,"latest"]}, "eth nonce "+short(a));
  return {known:true, balance:parseInt(b.result,16)/1e18,
          nonce: (n && n.result) ? parseInt(n.result,16) : 0};
}

/* ── BTC 単体 ─────────────────────────────────────── */
async function btcFlows(a){
  const txs = await getJSON(MEMPOOL+"/address/"+a+"/txs", "mempool txs "+short(a));
  const ins=[], outs=[];
  if(!Array.isArray(txs)) return {ins,outs,partial:true};
  for(const tx of txs){
    const t = (tx.status && tx.status.block_time) ? new Date(tx.status.block_time*1000).toISOString() : "";
    const recv = (tx.vout||[]).filter(v=>v.scriptpubkey_address===a).reduce((s,v)=>s+v.value,0)/1e8;
    const sent = (tx.vin||[]).filter(v=>v.prevout && v.prevout.scriptpubkey_address===a)
                             .reduce((s,v)=>s+v.prevout.value,0)/1e8;
    if(recv>sent){
      const senders=[...new Set((tx.vin||[]).map(v=>v.prevout && v.prevout.scriptpubkey_address).filter(Boolean))];
      ins.push({value:recv-sent, unit:"BTC", time:t, dir:"in", chain:"bitcoin", who:senders[0]||"(不明)"});
    }else if(sent>recv){
      const dests=[...new Set((tx.vout||[]).map(v=>v.scriptpubkey_address).filter(x=>x&&x!==a))];
      outs.push({value:sent-recv, unit:"BTC", time:t, dir:"out", chain:"bitcoin", who:dests[0]||"(不明)"});
    }
  }
  return {ins,outs,partial:txs.length>=25};
}

async function renderBTC(a){
  const p = await probeBTC(a);
  if(!p.known){
    out.innerHTML = verdict("bad","このアドレスの記録を取れませんでした",
      "mempool.space に届いていません。中継サーバーを設定するか、時間をおいて再試行してください。")+logBlock();
    return;
  }
  if(p.txs===0){
    out.innerHTML = verdict("none","一度も使われていないアドレスです",
      "取引が0件、UTXO も0件です。導出されただけで、お金は一度も動いていません。")+logBlock();
    return;
  }
  const f = await btcFlows(a);
  out.innerHTML = verdict("ok", "取引 "+p.txs+" 件、残高 "+fmt(p.balance)+" BTC",
      "累計で "+fmt(p.received)+" BTC を受け取り、"+fmt(p.sent)+" BTC を送り出しています。"
      + (p.txs>1000 ? " 取引数が非常に多く、取引所などの共用ウォレットの形です。個人のものと決めつけないでください。" : ""))
    + ledger("Bitcoin の出入り","取引ごとに、自分宛のおつりを差し引いた正味の額を出しています。",
             f.ins, f.outs, "このアドレスに送ってきた相手", "このアドレスが送った先")
    + notes([
        f.partial ? "表示しているのは直近の取引だけです。全部見るには mempool.space を開いてください。"
                  : "取引はすべて反映しています。",
        "1つの取引に相手が複数いる場合、代表として1つだけ表示しています。",
        "「相手」は取引に現れたアドレスであって、その人物とは限りません。"
      ]) + logBlock();
}

/* ── EVM / Hyperliquid ────────────────────────────── */
async function renderEVM(a){
  out.innerHTML = '<p class="spin">Unit・Bitcoin・Solana・Ethereum・Hyperliquid に問い合わせています…</p>';

  const ops = await getJSON(UNIT+"/operations/"+a, "unit operations");
  let addrs = (ops && Array.isArray(ops.addresses)) ? ops.addresses.slice() : [];
  if(!addrs.length){
    const pairs = [["bitcoin","btc"],["ethereum","eth"],["solana","sol"]];
    for(const pr of pairs){
      const g = await getJSON(UNIT+"/gen/"+pr[0]+"/hyperliquid/"+pr[1]+"/"+a, "unit gen "+pr[0]);
      if(g && g.address) addrs.push({sourceCoinType:pr[0], destinationChain:"hyperliquid", address:g.address});
    }
  }

  const LABEL = {bitcoin:"Bitcoin", ethereum:"Ethereum 系", solana:"Solana"};
  const rows = [];
  let anyVesselUsed = false;
  for(const x of addrs){
    const chain = String(x.sourceCoinType||"").toLowerCase();
    const toHL  = String(x.destinationChain||"").toLowerCase()==="hyperliquid";
    let badge = '<span class="badge unknown">未確認</span>';
    if(chain==="bitcoin"){
      const p = await probeBTC(x.address);
      if(!p.known) badge = '<span class="badge unknown">確認できず</span>';
      else if(p.txs===0) badge = '<span class="badge unused">なし</span>';
      else { badge = '<span class="badge used">'+p.txs+'件 / 累計 '+fmt(p.received,4)+' BTC</span>'; anyVesselUsed = true; }
    }else if(chain==="solana"){
      const p = await probeSOL(x.address);
      if(!p.known) badge = '<span class="badge unknown">確認できず</span>';
      else if(!p.used) badge = '<span class="badge unused">なし（口座が存在しない）</span>';
      else { badge = '<span class="badge used">取引あり</span>'; anyVesselUsed = true; }
    }else if(chain==="ethereum"){
      const p = await probeETH(x.address);
      if(!p.known) badge = '<span class="badge unknown">確認できず</span>';
      else if(p.balance===0 && p.nonce===0)
        badge = '<span class="badge unused">ETH の動きなし（ERC-20 は未確認）</span>';
      else { badge = '<span class="badge used">残高 '+fmt(p.balance,6)+' ETH / 送信 '+p.nonce+'件</span>'; anyVesselUsed = true; }
    }
    rows.push({chain, chainLabel:LABEL[chain]||chain||"?",
               role: toHL ? "入金の受け皿" : "出金の受け皿",
               address:x.address, badge});
  }

  const uIn=[], uOut=[];
  for(const o of ((ops && ops.operations) || [])){
    const src = String(o.sourceChain||"").toLowerCase();
    const dst = String(o.destinationChain||"").toLowerCase();
    const v = amt(o.sourceAmount, o.asset);
    if(dst==="hyperliquid" && src!=="hyperliquid")
      uIn.push({value:v, unit:String(o.asset||"").toUpperCase(), time:o.opCreatedAt,
                dir:"in", chain:src, who:o.sourceAddress});
    else if(src==="hyperliquid" && dst!=="hyperliquid")
      uOut.push({value:v, unit:String(o.asset||"").toUpperCase(), time:o.opCreatedAt,
                 dir:"out", chain:dst, who:o.destinationAddress});
  }

  const years = Number($("#span").value);
  const since = years===0 ? 0 : Date.now() - 1000*60*60*24*365*years;
  const led = await postJSON(HLINFO,
    {type:"userNonFundingLedgerUpdates", user:a, startTime:since}, "hyperliquid ledger");
  const c = classifyLedger(Array.isArray(led)?led:[], a);

  const peerIn = c.peer.in.reduce((s,r)=>s+r.value,0);
  const extIn  = c.ext.in.reduce((s,r)=>s+r.value,0);

  let v;
  if(uIn.length || uOut.length){
    v = verdict("ok","Unit 経由の入出金が見つかりました",
      "記録は "+(uIn.length+uOut.length)+" 件。下の「入ってきた」の相手が資金の出所です。");
  }else if(anyVesselUsed){
    v = verdict("bad","Unit の記録は空だが、受け皿は使われています",
      "記録が空でも受け皿アドレスに取引があります。API が古い記録を持っていないと考えられるので、そのアドレスを explorer で直接たどってください。");
  }else if(c.peer.in.length && peerIn > extIn){
    v = verdict("ok","主な入金は Hyperliquid 内の他アカウントからです",
      "外部チェーンからは "+fmt(extIn,0)+" USDC ですが、Hyperliquid 上の他アカウントから "
      +fmt(peerIn,0)+" USDC 入っています。出所をたどるには、下の相手アドレスを1つずつ調べてください。");
  }else if(c.ext.in.length || c.ext.out.length){
    v = verdict("none","BTC・SOL 経路は使われていません",
      "受け皿はすべて未使用でした。この口座の資金は外部チェーンからの USDC です。");
  }else{
    v = verdict("none","入出金の記録が見つかりませんでした",
      "期間を「全期間」に変えて再試行するか、受け皿アドレスを explorer で直接確認してください。");
  }

  out.innerHTML = v
    + ledger("Unit 経由（BTC・ETH・SOL）","本物の BTC などを預けた記録です。ここに相手が出れば、最も確かな出所です。",
             uIn, uOut, "送ってきた相手", "送った先")
    + ledger("外部チェーンとの出入り（USDC）","Arbitrum などのブリッジを通った、チェーンをまたぐ移動です。",
             c.ext.in, c.ext.out, "ブリッジ経由で入ってきた", "ブリッジ経由で出ていった")
    + ledger("Hyperliquid 内の他アカウントとの出入り","同じ Hyperliquid 上の別アカウント相手の送金です。他人からの入金もここに含まれます。",
             c.peer.in, c.peer.out, "送ってきたアカウント", "送った先のアカウント")
    + ledger("その他の増減（Vault・強制決済・報酬など）","出所ではありませんが、残高が動いた理由として記録しています。",
             c.other.in, c.other.out, "増えた要因", "減った要因")
    + vessels(rows)
    + tallyTable(c.tally)
    + notes([
        "受け皿アドレスは Unit が管理するもので、本人のアドレスではありません。<strong>ここへ送ってきた相手</strong>が本当の出所です。",
        "<strong>Hyperliquid 内の他アカウントからの送金は、他人からの入金でありえます。</strong>相手アドレスを1つずつ調べてください。",
        "除外しているのは自分の口座内の振替だけです。内訳表で全件確認できます。",
        "Binance などの取引所に行き着いたら、そこで追跡は終わりです。その先はチェーンの外なので、推測でつながないでください。",
        "受け皿が未使用でも、Ethereum は ERC-20 の受領までは見ていません。Etherscan の Token Transfers タブも確認してください。"
      ]) + logBlock();
}

function renderSOL(a){
  out.innerHTML = verdict("none","Solana の取引一覧はここでは出せません",
    "残高と利用の有無までは調べられますが、送金相手の一覧は公開 RPC では取りにくいため出していません。"
    + '<br><a href="https://solscan.io/account/'+esc(a)+'" target="_blank" rel="noopener">Solscan で開く</a>')
    + notes(["Hyperliquid 口座に紐づく Solana の受け皿を知りたい場合は、0x… のアドレスを入力してください。"]);
}

/* ── 起動 ─────────────────────────────────────────── */
async function run(){
  const a = $("#addr").value.trim();
  log = [];
  if(!a){ out.innerHTML = verdict("none","アドレスを入れてください","0x…、bc1…、Solana のアドレスに対応しています。"); return; }
  const k = kindOf(a);
  if(!k){ out.innerHTML = verdict("bad","形式が読み取れません","前後の空白や、途中で切れていないかを確かめてください。"); return; }
  $("#go").disabled = true;
  out.innerHTML = '<p class="spin">調べています…</p>';
  try{
    if(k==="evm")      await renderEVM(a);
    else if(k==="btc") await renderBTC(a);
    else               renderSOL(a);
  }catch(e){
    out.innerHTML = verdict("bad","処理中に問題が起きました", esc(e.message)) + logBlock();
  }finally{
    $("#go").disabled = false;
  }
}
$("#go").addEventListener("click", run);
$("#addr").addEventListener("keydown", e => { if(e.key==="Enter") run(); });
</script>
