<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>資金の出所しらべ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@300;400;600&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<!--
  ─────────────────────────────────────────────────────────────
  自分でホストするときのメモ

  1. このファイルを index.html としてリポジトリ直下に置き、
     Settings > Pages で公開するだけで動きます。ビルド不要。

  2. API キーは一切埋め込んでいません。使っているのは
     公開・認証不要のエンドポイントだけです。

  3. CORS について（重要）
     ブラウザから他ドメインを叩くので、相手サーバーが
     Access-Control-Allow-Origin を返さないと失敗します。
     ブラウザのアドレス欄で見えても fetch は通らない、
     ということが普通に起こります。
     通らない場合は画面下の「中継サーバー」欄に
     自分の Cloudflare Workers などの URL を入れてください。
     例（Workers の中身）:
       export default { async fetch(req) {
         const u = new URL(req.url).searchParams.get('u');
         const r = await fetch(u);
         return new Response(r.body, {status:r.status,
           headers:{'access-control-allow-origin':'*',
                    'content-type': r.headers.get('content-type')||'application/json'}});
       }}
     この場合、中継サーバー欄には  https://xxx.workers.dev/?u=  を入れる。

  4. 入力したアドレスや中継URLはブラウザに保存していません。
     保存したければ localStorage を自分で足してください。
  ─────────────────────────────────────────────────────────────
-->
<style>
:root{
  --paper:#E9EAE4;
  --paper-hi:#F3F4EF;
  --ink:#1C2321;
  --ink-soft:#5A625C;
  --rule:#C3C6BC;
  --rule-hard:#9AA096;
  --in:#1B5E4A;
  --in-bg:#DDE7E0;
  --out:#A8322D;
  --out-bg:#EDDCD9;
  --note:#7A5C1E;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:"IBM Plex Sans JP",system-ui,sans-serif;
  font-weight:400;
  line-height:1.7;
  font-feature-settings:"palt";
}
.mono{font-family:"IBM Plex Mono","IBM Plex Sans JP",monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:1000px;margin:0 auto;padding:0 20px 96px}

/* ── 見出し ───────────────────────────── */
header{padding:56px 0 28px;border-bottom:2px solid var(--ink)}
h1{
  margin:0 0 6px;
  font-size:clamp(28px,4.4vw,40px);
  font-weight:600;
  letter-spacing:.02em;
}
.lede{margin:0;max-width:56ch;color:var(--ink-soft);font-size:15px}

/* ── 入力 ─────────────────────────────── */
.query{margin:28px 0 0;display:flex;gap:10px;flex-wrap:wrap}
.query input[type=text]{
  flex:1 1 380px;min-width:0;
  padding:13px 14px;
  border:1px solid var(--rule-hard);
  background:var(--paper-hi);
  color:var(--ink);
  font-family:"IBM Plex Mono",monospace;
  font-size:14px;
  border-radius:2px;
}
.query input[type=text]:focus{outline:2px solid var(--in);outline-offset:1px}
button{
  padding:13px 26px;
  border:1px solid var(--ink);
  background:var(--ink);
  color:var(--paper-hi);
  font-family:inherit;font-size:15px;font-weight:600;
  border-radius:2px;cursor:pointer;
}
button:hover{background:#000}
button:disabled{opacity:.45;cursor:progress}
button:focus-visible{outline:2px solid var(--in);outline-offset:2px}
.hint{margin:10px 0 0;font-size:13px;color:var(--ink-soft)}

/* ── 判定札 ───────────────────────────── */
.verdict{
  margin:32px 0 0;padding:22px 24px;
  background:var(--paper-hi);
  border:1px solid var(--rule);
  border-left:5px solid var(--ink);
}
.verdict h2{margin:0 0 6px;font-size:20px;font-weight:600}
.verdict p{margin:0;color:var(--ink-soft);font-size:14px}
.verdict.ok{border-left-color:var(--in)}
.verdict.none{border-left-color:var(--note)}
.verdict.bad{border-left-color:var(--out)}

/* ── 借方/貸方 ─────────────────────────── */
.ledger{display:grid;grid-template-columns:1fr 1fr;gap:0;margin:36px 0 0;border-top:2px solid var(--ink)}
.ledger>section{padding:20px 22px 26px}
.ledger>section+section{border-left:1px solid var(--rule-hard)}
.ledger h3{margin:0 0 2px;font-size:16px;font-weight:600}
.ledger .sub{margin:0 0 16px;font-size:13px;color:var(--ink-soft)}
.side-in h3{color:var(--in)}
.side-out h3{color:var(--out)}
.total{font-size:26px;font-weight:600;margin:0 0 18px}
.side-in .total{color:var(--in)}
.side-out .total{color:var(--out)}

.entry{padding:12px 0;border-top:1px solid var(--rule)}
.entry .amt{font-size:17px;font-weight:600}
.entry .who{
  display:block;margin-top:3px;font-size:12px;
  word-break:break-all;color:var(--ink-soft);
}
.entry .who a{color:var(--ink-soft)}
.entry .when{font-size:12px;color:var(--ink-soft)}

/* ── 受け皿一覧 ─────────────────────────── */
.vessels{margin:44px 0 0}
.vessels h3{margin:0 0 4px;font-size:16px;font-weight:600}
.vessels .sub{margin:0 0 14px;font-size:13px;color:var(--ink-soft);max-width:62ch}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-weight:600;font-size:13px;border-bottom:1px solid var(--rule-hard)}
td.addr{font-family:"IBM Plex Mono",monospace;font-size:12px;word-break:break-all}
td a{color:var(--in)}
.badge{display:inline-block;padding:1px 8px;border-radius:2px;font-size:12px;font-weight:600;white-space:nowrap}
.badge.used{background:var(--in-bg);color:var(--in)}
.badge.unused{background:transparent;color:var(--ink-soft);border:1px solid var(--rule-hard)}
.badge.unknown{background:transparent;color:var(--note);border:1px dashed var(--note)}

/* ── 注記・ログ ─────────────────────────── */
.notes{margin:44px 0 0;padding:18px 20px;border:1px dashed var(--rule-hard);font-size:13px;color:var(--ink-soft)}
.notes ul{margin:8px 0 0;padding-left:1.2em}
.notes li{margin:4px 0}
details{margin:20px 0 0;font-size:13px}
summary{cursor:pointer;color:var(--ink-soft)}
pre{
  background:var(--paper-hi);border:1px solid var(--rule);
  padding:12px;overflow:auto;font-size:11.5px;max-height:340px;
  font-family:"IBM Plex Mono",monospace;
}
.proxy{margin:26px 0 0;font-size:13px;color:var(--ink-soft)}
.proxy input{
  width:100%;max-width:520px;margin-top:6px;padding:9px 11px;
  border:1px solid var(--rule-hard);background:var(--paper-hi);
  font-family:"IBM Plex Mono",monospace;font-size:12px;border-radius:2px;
}
.empty{padding:14px 0;color:var(--ink-soft);font-size:14px}
.spin{color:var(--ink-soft);font-size:14px;padding:14px 0}
@media (max-width:720px){
  .ledger{grid-template-columns:1fr}
  .ledger>section+section{border-left:0;border-top:1px solid var(--rule-hard)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>資金の出所しらべ</h1>
  <p class="lede">アドレスを1つ貼ると、そこに入ってきたお金と出ていったお金を、相手先つきで並べます。Hyperliquid のアドレスなら、紐づく本体の BTC・ETH・SOL アドレスも逆算します。</p>
</header>

<div class="query">
  <input type="text" id="addr" spellcheck="false" autocomplete="off"
         placeholder="0x… / bc1… / Solana アドレス">
  <button id="go">調べる</button>
</div>
<p class="hint">例：<code class="mono">0x8DeF9F50456c6c4E37fA5d3D57F108ED23992daE</code></p>

<div id="out"></div>

<div class="proxy">
  中継サーバー（通信が失敗するときだけ使う。末尾に URL がそのまま繋がる形で入力）
  <input type="text" id="proxy" spellcheck="false" autocomplete="off"
         placeholder="https://自分のworker.dev/?u=">
</div>

</div>

<script>
"use strict";

const UNIT     = "https://api.hyperunit.xyz";
const MEMPOOL  = "https://mempool.space/api";
const HLINFO   = "https://api.hyperliquid.xyz/info";

const $  = (s) => document.querySelector(s);
const out = $("#out");
const log = [];

/* ── 通信 ──────────────────────────────────────────── */
function proxied(url){
  const p = $("#proxy").value.trim();
  return p ? p + encodeURIComponent(url) : url;
}

async function getJSON(url){
  const t0 = performance.now();
  try{
    const r = await fetch(proxied(url), {headers:{accept:"application/json"}});
    const ms = Math.round(performance.now()-t0);
    if(!r.ok){ log.push(`✗ ${r.status} ${url} (${ms}ms)`); return null; }
    log.push(`✓ ${url} (${ms}ms)`);
    return await r.json();
  }catch(e){
    log.push(`✗ 通信失敗 ${url} — ${e.message}（CORS の可能性。中継サーバーを試す）`);
    return null;
  }
}

async function postJSON(url, body){
  const t0 = performance.now();
  try{
    const r = await fetch(proxied(url), {
      method:"POST",
      headers:{"content-type":"application/json"},
      body: JSON.stringify(body)
    });
    const ms = Math.round(performance.now()-t0);
    if(!r.ok){ log.push(`✗ ${r.status} ${url} (${ms}ms)`); return null; }
    log.push(`✓ ${url} ${body.type} (${ms}ms)`);
    return await r.json();
  }catch(e){
    log.push(`✗ 通信失敗 ${url} — ${e.message}`);
    return null;
  }
}

/* ── 判別・整形 ────────────────────────────────────── */
function kindOf(a){
  if(/^0x[0-9a-fA-F]{40}$/.test(a))                    return "evm";
  if(/^(bc1|tb1)[0-9a-z]{20,}$/i.test(a))              return "btc";
  if(/^[13][a-km-zA-HJ-NP-Z1-9]{24,34}$/.test(a))      return "btc";
  if(/^[1-9A-HJ-NP-Za-km-z]{32,44}$/.test(a))          return "sol";
  return null;
}

const DEC = {btc:8, eth:18, sol:9, avax:18, xpl:18, zec:8, mon:18, pump:6, fart:6};
const amt = (raw, asset) => {
  const d = DEC[(asset||"").toLowerCase()] ?? 18;
  const n = Number(raw)/Math.pow(10,d);
  return Number.isFinite(n) ? n : null;
};
const fmt = (n, dp=8) => n==null ? "—"
  : n.toLocaleString("ja-JP",{minimumFractionDigits:0, maximumFractionDigits:dp});
const short = (a) => !a ? "—" : (a.length>22 ? a.slice(0,10)+"…"+a.slice(-8) : a);
const day  = (t) => !t ? "" : String(t).slice(0,10);
const esc  = (s) => String(s??"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const ADDR_URL = {
  bitcoin:  a => `https://mempool.space/address/${a}`,
  ethereum: a => `https://etherscan.io/address/${a}`,
  solana:   a => `https://solscan.io/account/${a}`,
  hyperliquid: a => `https://hypurrscan.io/address/${a}`,
};
const link = (chain,a) => {
  const f = ADDR_URL[chain];
  return f ? `<a href="${f(a)}" target="_blank" rel="noopener">${esc(short(a))}</a>` : esc(short(a));
};

/* ── 描画部品 ──────────────────────────────────────── */
function verdict(cls, title, body){
  return `<div class="verdict ${cls}"><h2>${esc(title)}</h2><p>${body}</p></div>`;
}

function ledger(ins, outs, unitIn, unitOut){
  const sum = (rows) => rows.reduce((s,r)=>s+(r.value||0),0);
  const row = (r) => `
    <div class="entry">
      <span class="amt mono">${fmt(r.value)} ${esc(r.unit||"")}</span>
      <span class="when mono"> ${esc(day(r.time))}</span>
      <span class="who mono">${r.dir==="in"?"←":"→"} ${link(r.chain, r.who)}</span>
    </div>`;
  const side = (cls,h,sub,rows,unit) => `
    <section class="${cls}">
      <h3>${esc(h)}</h3>
      <p class="sub">${esc(sub)}</p>
      <p class="total mono">${rows.length? fmt(sum(rows))+" "+esc(unit) : "—"}</p>
      ${rows.length ? rows.map(row).join("")
                    : `<p class="empty">記録が見つかりません。</p>`}
    </section>`;
  return `<div class="ledger">
    ${side("side-in","入ってきた","このアドレスにお金を送った相手", ins, unitIn)}
    ${side("side-out","出ていった","このアドレスがお金を送った先", outs, unitOut)}
  </div>`;
}

function vessels(rows){
  if(!rows.length) return "";
  return `<div class="vessels">
    <h3>この口座に紐づく受け皿アドレス</h3>
    <p class="sub">Hyperliquid 口座ごとに固定で割り当てられる入出金用アドレスです。管理しているのは Unit であって本人ではないので、注目すべきは「ここへ送ってきた相手」の方です。</p>
    <table><thead><tr><th>チェーン</th><th>用途</th><th>アドレス</th><th>使われた形跡</th></tr></thead><tbody>
    ${rows.map(r=>`<tr>
      <td>${esc(r.chainLabel)}</td>
      <td>${esc(r.role)}</td>
      <td class="addr">${link(r.chain, r.address)}</td>
      <td>${r.badge}</td>
    </tr>`).join("")}
    </tbody></table></div>`;
}

function notes(items){
  return `<div class="notes"><strong>読むときの注意</strong><ul>${
    items.map(i=>`<li>${i}</li>`).join("")}</ul></div>`;
}

function logBlock(){
  return `<details><summary>通信ログを見る（${log.length}件）</summary><pre>${esc(log.join("\n"))}</pre></details>`;
}

/* ── BTC アドレスを調べる ──────────────────────────── */
async function probeBTC(a){
  const d = await getJSON(`${MEMPOOL}/address/${a}`);
  if(!d) return {known:false};
  const cs = d.chain_stats||{}, ms = d.mempool_stats||{};
  const txs = (cs.tx_count||0)+(ms.tx_count||0);
  return {
    known:true, txs,
    received:(cs.funded_txo_sum||0)/1e8,
    sent:(cs.spent_txo_sum||0)/1e8,
    balance:((cs.funded_txo_sum||0)-(cs.spent_txo_sum||0))/1e8,
  };
}

async function btcFlows(a){
  const txs = await getJSON(`${MEMPOOL}/address/${a}/txs`);
  const ins=[], outs=[];
  if(!Array.isArray(txs)) return {ins,outs,partial:true};
  for(const tx of txs){
    const t = tx.status?.block_time ? new Date(tx.status.block_time*1000).toISOString() : "";
    const recv = (tx.vout||[]).filter(v=>v.scriptpubkey_address===a)
                              .reduce((s,v)=>s+v.value,0)/1e8;
    const sent = (tx.vin||[]).filter(v=>v.prevout?.scriptpubkey_address===a)
                             .reduce((s,v)=>s+v.prevout.value,0)/1e8;
    if(recv>sent){
      const senders=[...new Set((tx.vin||[]).map(v=>v.prevout?.scriptpubkey_address).filter(Boolean))];
      ins.push({value:recv-sent, unit:"BTC", time:t, dir:"in",
                chain:"bitcoin", who:senders[0]||"(不明)"});
    }else if(sent>recv){
      const dests=[...new Set((tx.vout||[]).map(v=>v.scriptpubkey_address)
                    .filter(x=>x && x!==a))];
      outs.push({value:sent-recv, unit:"BTC", time:t, dir:"out",
                 chain:"bitcoin", who:dests[0]||"(不明)"});
    }
  }
  return {ins,outs,partial:txs.length>=25};
}

/* ── 画面 ─────────────────────────────────────────── */
async function renderBTC(a){
  const p = await probeBTC(a);
  if(!p.known){
    out.innerHTML = verdict("bad","このアドレスの記録を取れませんでした",
      "mempool.space に届いていません。中継サーバーを設定するか、時間をおいて再試行してください。")+logBlock();
    return;
  }
  if(p.txs===0){
    out.innerHTML = verdict("none","一度も使われていないアドレスです",
      "取引が0件です。生成されただけで、お金は動いていません。")+logBlock();
    return;
  }
  const f = await btcFlows(a);
  out.innerHTML =
    verdict("ok", `取引 ${p.txs} 件、残高 ${fmt(p.balance)} BTC`,
      `累計で ${fmt(p.received)} BTC を受け取り、${fmt(p.sent)} BTC を送り出しています。` +
      (p.txs>1000 ? " 取引数が非常に多く、取引所などの共用ウォレットの形をしています。個人のものと決めつけないでください。" : ""))
    + ledger(f.ins, f.outs, "BTC", "BTC")
    + notes([
        f.partial ? "表示しているのは直近の取引だけです。全部を見るには mempool.space を開いてください。" : "取引はすべて表示しています。",
        "同じ取引に複数の相手がいる場合、代表として1つだけ表示しています。",
        "「相手」は取引の入力・出力に現れたアドレスであって、その人物とは限りません。"
      ])
    + logBlock();
}

async function renderEVM(a){
  out.innerHTML = `<p class="spin">Unit・Bitcoin・Hyperliquid に問い合わせています…</p>`;

  const ops = await getJSON(`${UNIT}/operations/${a}`);

  // /operations が受け皿を返さなかったときは /gen で補う
  let addrs = (ops && Array.isArray(ops.addresses)) ? ops.addresses.slice() : [];
  if(!addrs.length){
    for(const [chain,asset] of [["bitcoin","btc"],["ethereum","eth"],["solana","sol"]]){
      const g = await getJSON(`${UNIT}/gen/${chain}/hyperliquid/${asset}/${a}`);
      if(g?.address) addrs.push({sourceCoinType:chain, destinationChain:"hyperliquid", address:g.address});
    }
  }

  // 受け皿ごとに、実際に使われたか確かめる
  const CHAIN_LABEL = {bitcoin:"Bitcoin", ethereum:"Ethereum 系", solana:"Solana"};
  const rows = [];
  for(const x of addrs){
    const chain = (x.sourceCoinType||"").toLowerCase();
    const toHL  = (x.destinationChain||"").toLowerCase()==="hyperliquid";
    let badge = `<span class="badge unknown">未確認</span>`;
    if(chain==="bitcoin"){
      const p = await probeBTC(x.address);
      badge = !p.known ? `<span class="badge unknown">確認できず</span>`
            : p.txs===0 ? `<span class="badge unused">なし</span>`
            : `<span class="badge used">${p.txs}件 / 累計 ${fmt(p.received,4)} BTC</span>`;
    }
    rows.push({
      chain, chainLabel: CHAIN_LABEL[chain] || chain || "?",
      role: toHL ? "入金の受け皿" : "出金の受け皿",
      address: x.address, badge
    });
  }

  // Unit のオペレーション（あれば、これが一番確かな出所）
  const uIn=[], uOut=[];
  for(const o of (ops?.operations||[])){
    const src=(o.sourceChain||"").toLowerCase(), dst=(o.destinationChain||"").toLowerCase();
    const v = amt(o.sourceAmount, o.asset);
    if(dst==="hyperliquid" && src!=="hyperliquid")
      uIn.push({value:v, unit:(o.asset||"").toUpperCase(), time:o.opCreatedAt,
                dir:"in", chain:src, who:o.sourceAddress});
    else if(src==="hyperliquid" && dst!=="hyperliquid")
      uOut.push({value:v, unit:(o.asset||"").toUpperCase(), time:o.opCreatedAt,
                 dir:"out", chain:dst, who:o.destinationAddress});
  }

  // Hyperliquid 本体の入出金（USDC）
  const since = Date.now() - 1000*60*60*24*365*3;
  const led = await postJSON(HLINFO, {type:"userNonFundingLedgerUpdates", user:a, startTime:since});
  const hIn=[], hOut=[];
  const INTERNAL = new Set(["internalTransfer","subAccountTransfer","accountClassTransfer","spotTransfer"]);
  let internalCount = 0;
  if(Array.isArray(led)){
    for(const e of led){
      const d = e.delta||{}, t = e.time ? new Date(e.time).toISOString() : "";
      if(INTERNAL.has(d.type)){ internalCount++; continue; }
      if(d.type==="deposit")
        hIn.push({value:Number(d.usdc), unit:"USDC", time:t, dir:"in",
                  chain:"ethereum", who:"外部チェーンのブリッジ"});
      else if(d.type==="withdraw")
        hOut.push({value:Number(d.usdc), unit:"USDC", time:t, dir:"out",
                   chain:"ethereum", who:"外部チェーンへ"});
    }
  }

  const ins  = uIn.length  ? uIn  : hIn;
  const outs = uOut.length ? uOut : hOut;
  const unitIn  = uIn.length  ? (uIn[0].unit||"")  : "USDC";
  const unitOut = uOut.length ? (uOut[0].unit||"") : "USDC";

  // 結論
  let v;
  const usedBTC = rows.some(r=>r.chain==="bitcoin" && r.badge.includes("badge used"));
  if(uIn.length || uOut.length){
    v = verdict("ok","Unit 経由の入出金が見つかりました",
      `記録は ${uIn.length+uOut.length} 件です。下の「入ってきた」に出ている相手が、資金の出所そのものです。`);
  }else if(usedBTC){
    v = verdict("bad","API は空だが、BTC の受け皿は使われています",
      "Unit の記録は空でしたが、受け皿の BTC アドレスに取引があります。API が古い記録を保持していないと考えられるので、"+
      "そのアドレスを mempool.space で開いて直接たどってください。");
  }else if(hIn.length || hOut.length){
    v = verdict("none","BTC 経路は使われていません",
      `Unit の記録は空、受け皿にも取引がありません。この口座の資金は Arbitrum のブリッジ経由の USDC です。` +
      `その入出金を下に出しています${internalCount?`（口座内の振替 ${internalCount} 件は除いています）`:""}。`);
  }else{
    v = verdict("none","入出金の記録が見つかりませんでした",
      "受け皿のアドレスだけ表示します。それぞれを explorer で開いて、本当に使われていないか確かめてください。");
  }

  out.innerHTML = v
    + ledger(ins, outs, unitIn, unitOut)
    + vessels(rows)
    + notes([
        "受け皿アドレスは Unit が管理するもので、本人のアドレスではありません。<strong>ここへ送ってきた相手</strong>が本当の出所です。",
        "口座内の振替（サブ口座間、現物と証拠金の間）は出所ではないので除いています。",
        "Binance などの取引所に行き着いたら、そこで追跡は終わりです。その先はチェーンの外なので、推測でつながないでください。",
        "Unit の記録が空でも「使っていない」と即断せず、必ず受け皿アドレスを explorer で確認してください。"
      ])
    + logBlock();
}

function renderSOL(a){
  out.innerHTML = verdict("none","Solana はここでは追えません",
    `鍵なしで使える公開 API がないため、このツールでは残高や取引を取得できません。` +
    `<br><a href="https://solscan.io/account/${esc(a)}" target="_blank" rel="noopener">Solscan で開く</a>`)
    + notes(["Hyperliquid の口座に紐づく Solana の受け皿を知りたい場合は、0x… の方のアドレスを入力してください。"]);
}

/* ── 起動 ─────────────────────────────────────────── */
async function run(){
  const a = $("#addr").value.trim();
  log.length = 0;
  if(!a){ out.innerHTML = verdict("none","アドレスを入れてください","0x…、bc1…、Solana のアドレスに対応しています。"); return; }
  const k = kindOf(a);
  if(!k){ out.innerHTML = verdict("bad","形式が読み取れません","前後の空白や、途中で切れていないかを確かめてください。"); return; }

  $("#go").disabled = true;
  out.innerHTML = `<p class="spin">調べています…</p>`;
  try{
    if(k==="evm")      await renderEVM(a);
    else if(k==="btc") await renderBTC(a);
    else               renderSOL(a);
  }catch(e){
    out.innerHTML = verdict("bad","処理中に問題が起きました", esc(e.message)) + logBlock();
  }finally{
    $("#go").disabled = false;
  }
}

$("#go").addEventListener("click", run);
$("#addr").addEventListener("keydown", e => { if(e.key==="Enter") run(); });
</script>
</body>
</html>
